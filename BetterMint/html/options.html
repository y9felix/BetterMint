<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BetterMint</title>
    <link rel="stylesheet" href="../css/options.css">
    <script src="../js/loader.js" defer></script>
    <script src="../js/options.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="../img/betterlogo.png" alt="" class="brand-logo">
            <h1 class="brand-title">BetterMint</h1>
        </div>
    </header>

    <main class="settings-container">
        <section class="card">
            <h2 class="card-title">Engine</h2>

            <div class="control-col">
                <label class="control-label-text" for="option-url-api-stockfish">WebSocket API URL</label>
                <input id="option-url-api-stockfish" type="text" class="text-input" placeholder="ws://localhost:8000/ws" spellcheck="false" autocomplete="off" />
            </div>

            <details id="go-command-details" class="collapse-group">
                <summary class="collapse-summary">Search Options</summary>
                <div class="collapse-content">
                    <div class="control-col">
                        <div class="slider-header">
                            <label class="title" for="option-depth">Search Depth</label>
                            <button type="button" class="badge" id="badge-option-depth" aria-label="Edit Search Depth value">3</button>
                        </div>
                        <input id="option-depth" type="range" min="0" max="50" step="1" value="3" class="range-slider" />
                    </div>

                    <div class="control-col">
                        <div class="slider-header">
                            <label class="title" for="option-go-movetime">Move Time (ms)</label>
                            <button type="button" class="badge" id="badge-option-go-movetime" aria-label="Edit Move Time value">Off</button>
                        </div>
                        <input id="option-go-movetime" type="range" min="0" max="5000" step="50" value="0" class="range-slider" />
                    </div>

                    <div class="control-col">
                        <div class="slider-header">
                            <label class="title" for="option-go-nodes">Node Limit</label>
                            <button type="button" class="badge" id="badge-option-go-nodes" aria-label="Edit Node Limit value">Off</button>
                        </div>
                        <input id="option-go-nodes" type="range" min="0" max="5000000" step="10000" value="0" class="range-slider" />
                    </div>
                </div>
            </details>

            <details id="engine-options-details" class="collapse-group">
                <summary class="collapse-summary">UCI Options</summary>
                <div id="engine-options-container" class="collapse-content" aria-live="polite" aria-busy="false">
                    <span class="status-text">Expand to load engine options.</span>
                </div>
            </details>
        </section>

        <section class="card">
            <h2 class="card-title">Display</h2>

            <label class="control-row" for="option-evaluation-bar">
                <span class="control-label-text">Evaluation Bar</span>
                <input id="option-evaluation-bar" type="checkbox" class="toggle-input" checked />
                <span class="toggle-slider" aria-hidden="true"></span>
            </label>

            <label class="control-row" for="option-show-hints">
                <span class="control-label-text">Show Hints</span>
                <input id="option-show-hints" type="checkbox" class="toggle-input" checked />
                <span class="toggle-slider" aria-hidden="true"></span>
            </label>

            <label class="control-row" for="option-move-analysis">
                <span class="control-label-text">Move Analysis</span>
                <input id="option-move-analysis" type="checkbox" class="toggle-input" checked />
                <span class="toggle-slider" aria-hidden="true"></span>
            </label>
        </section>

        <section class="card">
            <h2 class="card-title">Automation</h2>

            <label class="control-row" for="option-auto-queue">
                <span class="control-label-text">Auto Queue</span>
                <input id="option-auto-queue" type="checkbox" class="toggle-input" />
                <span class="toggle-slider" aria-hidden="true"></span>
            </label>

            <div id="auto-queue-group" class="sub-panel hidden">
                <div class="sub-panel-inner">
                    <label class="control-row" for="option-rematch-first">
                        <span class="control-label-text">Rematch first</span>
                        <input id="option-rematch-first" type="checkbox" class="toggle-input" />
                        <span class="toggle-slider" aria-hidden="true"></span>
                    </label>
                </div>
            </div>

            <label class="control-row" for="option-legit-auto-move">
                <span class="control-label-text">Auto Move</span>
                <input id="option-legit-auto-move" type="checkbox" class="toggle-input" />
                <span class="toggle-slider" aria-hidden="true"></span>
            </label>

            <div id="pacing-group" class="sub-panel hidden">
                <div class="sub-panel-inner">
                    <label class="control-row" for="option-human-like-moves">
                        <span class="control-label-text">Human-like Moves</span>
                        <input id="option-human-like-moves" type="checkbox" class="toggle-input" checked />
                        <span class="toggle-slider" aria-hidden="true"></span>
                    </label>

                    <div id="human-pace-group" class="sub-panel">
                        <div class="sub-panel-inner">
                            <div class="control-col">
                                <div class="slider-header">
                                    <label class="title" for="option-move-pace">Move Pace (Seconds)</label>
                                    <button type="button" class="badge" id="badge-option-move-pace" aria-label="Edit Move Pace value">12.50</button>
                                </div>
                                <input id="option-move-pace" type="range" min="0.5" max="30.0" step="0.05" value="12.5" class="range-slider" />
                            </div>

                            <details id="advanced-timing-details" class="collapse-group">
                                <summary class="collapse-summary">Advanced Timing Settings</summary>
                                <div class="collapse-content">
                                    <div class="control-col">
                                        <div class="slider-header">
                                            <label class="title" for="option-physical-floor">Physical Floor (ms)</label>
                                            <button type="button" class="badge" id="badge-option-physical-floor" aria-label="Edit Physical Floor value">600</button>
                                        </div>
                                        <input id="option-physical-floor" type="range" min="50" max="1000" step="10" value="600" class="range-slider" />
                                    </div>

                                    <div class="control-col">
                                        <div class="slider-header">
                                            <label class="title" for="option-timing-spread">Timing Spread (σ)</label>
                                            <button type="button" class="badge" id="badge-option-timing-spread" aria-label="Edit Timing Spread value">0.80</button>
                                        </div>
                                        <input id="option-timing-spread" type="range" min="0.10" max="1.20" step="0.05" value="0.80" class="range-slider" />
                                    </div>

                                    <div class="control-col">
                                        <div class="slider-header">
                                            <label class="title" for="option-reflex-multiplier">Reflex Move Multiplier</label>
                                            <button type="button" class="badge" id="badge-option-reflex-multiplier" aria-label="Edit Reflex Move Multiplier value">0.25</button>
                                        </div>
                                        <input id="option-reflex-multiplier" type="range" min="0.10" max="1.00" step="0.05" value="0.25" class="range-slider" />
                                    </div>

                                    <div class="control-col">
                                        <div class="slider-header">
                                            <label class="title" for="option-opening-moves-threshold">Opening Moves</label>
                                            <button type="button" class="badge" id="badge-option-opening-moves-threshold" aria-label="Edit Opening Moves value">10</button>
                                        </div>
                                        <input id="option-opening-moves-threshold" type="range" min="0" max="15" step="1" value="10" class="range-slider" />
                                    </div>

                                    <div class="control-col">
                                        <div class="slider-header">
                                            <label class="title" for="option-opening-multiplier">Opening Multiplier</label>
                                            <button type="button" class="badge" id="badge-option-opening-multiplier" aria-label="Edit Opening Multiplier value">0.40</button>
                                        </div>
                                        <input id="option-opening-multiplier" type="range" min="0.10" max="1.00" step="0.05" value="0.40" class="range-slider" />
                                    </div>

                                    <div class="control-col">
                                        <div class="slider-header">
                                            <label class="title" for="option-clock-threshold">Clock Threshold (Seconds)</label>
                                            <button type="button" class="badge" id="badge-option-clock-threshold" aria-label="Edit Clock Threshold value">180</button>
                                        </div>
                                        <input id="option-clock-threshold" type="range" min="0" max="300" step="5" value="180" class="range-slider" />
                                    </div>
                                </div>
                            </details>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="footer-meta">
            <span class="version-badge">v2.2.9</span>
            <span id="config-status" class="config-status hidden" role="status" aria-live="polite"></span>
        </div>
        <div id="config-popover" class="config-popover hidden" role="dialog" aria-labelledby="config-popover-title">
            <div class="config-panel-header">
                <h2 id="config-popover-title" class="config-panel-title">Configs</h2>
                <button id="config-close" type="button" class="config-close-btn" title="Close" aria-label="Close configs">&times;</button>
            </div>
            <div class="config-save-row">
                <input id="config-save-name" type="text" class="text-input" placeholder="Config name" aria-label="Config name" spellcheck="false" autocomplete="off" />
                <button id="config-save-confirm" type="button" class="btn-primary" disabled>Save</button>
            </div>
            <div id="config-load-list" class="config-list"></div>
        </div>
        <div class="footer-actions">
            <button id="config-toggle" type="button" class="icon-btn" title="Configs" aria-label="Configs" aria-controls="config-popover" aria-expanded="false">
                <svg viewBox="0 0 16 16" class="svg-icon" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z" />
                </svg>
            </button>
            <button id="theme-toggle" type="button" class="icon-btn" title="Theme: Dark" aria-label="Theme: Dark">
                <svg viewBox="0 0 16 16" class="svg-icon" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278" />
                </svg>
            </button>
            <button id="github-link" type="button" class="icon-btn" title="GitHub Repository" aria-label="GitHub Repository">
                <svg viewBox="0 0 16 16" class="svg-icon" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
                </svg>
            </button>
        </div>
    </footer>
</body>
</html>
